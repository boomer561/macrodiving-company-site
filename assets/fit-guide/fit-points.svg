<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">Three separate fit questions</title><desc id="desc">A mask, snorkel and fin are drawn in separate rows. Face seal, comfortable mouthpiece and the exact foot or boot fit are labelled as different decisions. The illustration does not recommend a model or size.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#296a6e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="600" height="590" fill="#f8f6f1"/><text x="30" y="46" font-size="31" fill="#20313a" text-anchor="start" font-weight="600">Three separate fit questions</text><path d="M40 137 Q83 115 110 139 Q137 115 180 137 L168 203 H121 L110 186 L99 203 H52 Z" fill="#dce5df" stroke="#20313a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="172" font-size="31" fill="#20313a" text-anchor="start" font-weight="600">Mask → face</text><path d="M76 274 V339 Q76 375 120 375 H156" fill="none" stroke="#296a6e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="322" font-size="28" fill="#20313a" text-anchor="start" font-weight="600">Snorkel → mouth</text><path d="M60 421 H138 L186 500 H14 Z" fill="#dce5df" stroke="#20313a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="406" width="51" height="42" rx="10" fill="#f8f6f1" stroke="#20313a" stroke-width="3"/><text x="240" y="451" font-size="28" fill="#20313a" text-anchor="start" font-weight="600">Fin → foot / boot</text><text x="30" y="550" font-size="23" fill="#296a6e" text-anchor="start" font-weight="500">Try the exact pieces together.</text><text x="30" y="572" font-size="17" fill="#296a6e" text-anchor="start" font-weight="400">Original teaching diagram · not a recorded test</text></g></svg>
