<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">Fit is a separate decision</title><desc id="desc">Four fitting records: exact garment cut and size, actual boot and fin pocket, actual mask and snorkel, and a written result naming the variant and any unresolved fit.</desc><rect width="360" height="650" fill="#f1f5f2"/><g font-family="Arial, sans-serif" fill="#183e45"><text x="22" y="37" font-size="22" font-weight="700">Fit is a separate decision</text><text x="22" y="65" font-size="16">An asking price cannot settle fit.</text><rect x="18" y="91" width="324" height="110" rx="9" fill="white" stroke="#b4c7c3"/><text x="33" y="119" font-size="18" font-weight="700">Garment</text><text x="33" y="148" font-size="17">Exact cut and size</text><text x="33" y="174" font-size="17">→ fitting and movement check</text><rect x="18" y="217" width="324" height="110" rx="9" fill="white" stroke="#b4c7c3"/><text x="33" y="245" font-size="18" font-weight="700">Footwear</text><text x="33" y="274" font-size="17">Actual boot or drysuit foot</text><text x="33" y="300" font-size="17">→ exact fin pocket chart</text><rect x="18" y="343" width="324" height="110" rx="9" fill="white" stroke="#b4c7c3"/><text x="33" y="371" font-size="18" font-weight="700">Face and mouthpiece</text><text x="33" y="400" font-size="17">Actual mask and snorkel</text><text x="33" y="426" font-size="17">→ appropriate fitting check</text><rect x="18" y="469" width="324" height="110" rx="9" fill="white" stroke="#b4c7c3"/><text x="33" y="497" font-size="18" font-weight="700">Record the result</text><text x="33" y="526" font-size="17">Model + variant + observation</text><text x="33" y="552" font-size="17">Unresolved fit stays open</text><text x="22" y="618" font-size="15">Original Macro Diving editorial drawing</text><text x="22" y="640" font-size="14">Research context · not a hardware test</text></g></svg>