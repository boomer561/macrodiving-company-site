<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc"><title id="title">Coverage, fit and footwear</title><desc id="desc">A generic suit outline, a movement arrow, and a boot beside a fin represent three different checks: body coverage, usable fit and the exact footwear-to-fin combination. No temperature, size or exposure-protection rating is shown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#296a6e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="600" height="560" fill="#f8f6f1"/><text x="30" y="46" font-size="31" fill="#20313a" text-anchor="start" font-weight="600">Coverage, fit and footwear</text><path d="M95 132 L57 159 L27 272 L67 285 L95 215 V397 H142 V282 H161 V397 H208 V215 L236 285 L276 272 L244 159 L207 132 L182 174 H121 Z" fill="#dce5df" stroke="#20313a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="105" font-size="31" fill="#20313a" text-anchor="start" font-weight="600">Coverage</text><text x="329" y="134" font-size="32" fill="#20313a" text-anchor="start" font-weight="600">Fit</text><path d="M345 182 Q430 140 504 192" fill="none" stroke="#296a6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M504 192 L482 171" fill="none" stroke="#296a6e" stroke-width="4"/><path d="M504 192 L475 199" fill="none" stroke="#296a6e" stroke-width="4"/><path d="M337 305 H385 V364 H446 Q470 365 468 397 H337 Z" fill="#dce5df" stroke="#20313a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M354 424 H437 L506 490 H306 Z" fill="#dce5df" stroke="#20313a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="266" font-size="31" fill="#20313a" text-anchor="start" font-weight="600">Boot + fin</text><text x="30" y="527" font-size="23" fill="#296a6e" text-anchor="start" font-weight="500">Choose the fit for the actual diver.</text><text x="30" y="542" font-size="17" fill="#296a6e" text-anchor="start" font-weight="400">Original teaching diagram · not a recorded test</text></g></svg>
